name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: romaine-life/pipeline-templates/actions/check-fetches@main
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...HEAD")
          if grep -qvE '\.md$|^docs/|^LICENSE$' <<< "$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          fi

  portable:
    name: Portable client tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: romaine-life/pipeline-templates/actions/home-cache@main
      - name: Sign in to read shows-control from Forgejo
        env:
          TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
        run: |
          test -n "$TOKEN"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          {
            echo GIT_CONFIG_COUNT=1
            echo GIT_CONFIG_KEY_0=http.https://forgejo.romaine.life/nelsong6/shows.git.extraheader
            echo "GIT_CONFIG_VALUE_0=Authorization: Basic $auth"
          } >> "$GITHUB_ENV"
      - uses: romaine-life/pipeline-templates/actions/rust-toolchain@main
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  build:
    name: Windows client and release
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    outputs:
      release-tag: ${{ steps.publish.outputs.tag }}
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'Stop'; . ([scriptblock]::Create([IO.File]::ReadAllText('{0}'))); if (Test-Path variable:LASTEXITCODE) { exit $LASTEXITCODE }"
    steps:
      - uses: actions/checkout@v4
      # The remote's version and its release tag (PIPT-7): main reserves the next v0.1.N on
      # this commit; any other run is named after it, v0.1.N-prP.R, and is not released.
      - id: version
        uses: romaine-life/pipeline-templates/actions/release-version@main
        with:
          prefix: v0.1
          publish: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      - uses: romaine-life/pipeline-templates/actions/home-cache@main
      - name: Sign in to read shows-control from Forgejo
        env:
          TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
        run: |
          if (-not $env:TOKEN) { throw 'PIPELINE_DISPATCH_TOKEN is not set' }
          $auth=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:TOKEN"))
          Write-Host "::add-mask::$auth"
          'GIT_CONFIG_COUNT=1',
          'GIT_CONFIG_KEY_0=http.https://forgejo.romaine.life/nelsong6/shows.git.extraheader',
          "GIT_CONFIG_VALUE_0=Authorization: Basic $auth" | Add-Content $env:GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: target
          key: shows-remote-windows-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: shows-remote-windows-v1-
      - uses: romaine-life/pipeline-templates/actions/rust-toolchain@main
      - name: Test and build debug client
        run: |
          cargo test --locked -j 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked -j 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build release client
        if: github.event_name != 'pull_request'
        env:
          SHOWS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $env:SHOWS_BUILD_TIME=[DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          cargo build --release --locked -j 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # A pull request signs its debug build, so signing is never first tried on main.
      - name: Sign
        env:
          AT_TERMINAL_PFX: ${{ secrets.AT_TERMINAL_PFX }}
          AT_TERMINAL_PFX_PASSWORD: ${{ secrets.AT_TERMINAL_PFX_PASSWORD }}
        run: |
          $profile=if ('${{ github.event_name }}' -eq 'pull_request') { 'debug' } else { 'release' }
          Copy-Item "target/$profile/shows-remote.exe" shows-remote-windows-amd64.exe
          $expected='FE35227FED82F2429AFE763A36358ADDD79C7A4F'
          if (-not $env:AT_TERMINAL_PFX -or -not $env:AT_TERMINAL_PFX_PASSWORD) { throw 'The home code-signing identity is not configured' }
          $certificate=[Security.Cryptography.X509Certificates.X509Certificate2]::new(
            [Convert]::FromBase64String($env:AT_TERMINAL_PFX), $env:AT_TERMINAL_PFX_PASSWORD,
            [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
          try {
            if ($certificate.Thumbprint -ne $expected -or -not $certificate.HasPrivateKey) { throw 'Unexpected home signing certificate' }
            # The Windows runner already trusts the home identity, so Valid needs no change to its trust stores.
            $signature=Set-AuthenticodeSignature -FilePath shows-remote-windows-amd64.exe -Certificate $certificate -HashAlgorithm SHA256
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $expected) { throw "Signing verification failed: $($signature.Status)" }
          } finally { $certificate.Dispose() }
      # Leaves a complete draft; the home-sync job publishes it and starts every PC's install.
      - name: Draft the release
        id: publish
        if: steps.version.outputs.tag != ''
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $asset='shows-remote-windows-amd64.exe'
          $sha=(git rev-parse HEAD).Trim(); $tag=$env:TAG
          $api="$env:GITHUB_SERVER_URL/api/v1/repos/$env:GITHUB_REPOSITORY"
          $headers=@{Authorization="token $env:TOKEN"}
          $existing=Invoke-RestMethod "$api/releases/tags/$tag" -Headers $headers -SkipHttpErrorCheck -StatusCodeVariable code
          if ($code -notin @(200,404)) { throw "Release lookup returned $code" }
          if ($code -eq 200 -and -not $existing.draft) {
            $tagged=Invoke-RestMethod "$api/tags/$tag" -Headers $headers
            if ($tagged.commit.sha -ne $sha -or $existing.target_commitish -ne $sha -or -not ($existing.assets | Where-Object { $_.name -eq $asset -and $_.size -gt 0 })) { throw 'Published release identity differs' }
            Write-Host "Signed release $tag is already published"
          } else {
            if ($code -eq 200) { $release=$existing } else {
              $release=Invoke-RestMethod "$api/releases" -Method Post -Headers $headers -ContentType application/json -Body (@{tag_name=$tag;target_commitish=$sha;name="Shows remote $tag";body="Independent signed Windows client for control protocol 1, built from $sha.";draft=$true} | ConvertTo-Json)
            }
            foreach ($old in @($release.assets)) { Invoke-RestMethod "$api/releases/$($release.id)/assets/$($old.id)" -Method Delete -Headers $headers | Out-Null }
            Invoke-RestMethod "$api/releases/$($release.id)/assets?name=$asset" -Method Post -Headers $headers -Form @{attachment=Get-Item $asset} | Out-Null
            Write-Host "Drafted $tag at $sha"
          }
          "tag=$tag" | Add-Content $env:GITHUB_OUTPUT

  home-sync:
    needs: build
    uses: romaine-life/pipeline-templates/.forgejo/workflows/home-sync.yml@main
    secrets: inherit
    with:
      release-tag: ${{ needs.build.outputs.release-tag }}
